<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BloodBridge | Events Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-pink-50 to-red-100 text-gray-800 min-h-screen">

  <!-- Header -->
  <header class="bg-red-600 text-white text-center py-6">
    <h1 class="text-3xl font-bold"> Blood Donation Camps - BloodBridge</h1>
    <p class="text-sm mt-1">Organize, update & view all blood donation events across Mysore</p>
  </header>

  <!-- Add New Event Form -->
  <section class="max-w-4xl mx-auto mt-8 px-6 py-6 bg-white rounded-xl shadow-lg">
    <h2 class="text-xl font-bold text-red-600 mb-4">➕ Add New Camp</h2>
    <form id="eventForm" class="grid md:grid-cols-2 gap-4">
      <input type="text" id="hospital" required placeholder="Hospital Name" class="p-3 border rounded-md" />
      <input type="text" id="location" required placeholder="Location / Venue" class="p-3 border rounded-md" />
      <input type="date" id="date" required class="p-3 border rounded-md" />
      <input type="text" id="time" required placeholder="Time (e.g., 10 AM - 2 PM)" class="p-3 border rounded-md" />
      <input type="text" id="organizer" required placeholder="Organized By" class="p-3 border rounded-md" />
      <button type="submit" class="col-span-2 mt-2 bg-red-600 text-white py-3 rounded-md hover:bg-red-700">Add Camp</button>
    </form>
  </section>

  <!-- Display Events -->
  <main class="max-w-4xl mx-auto mt-10 px-6 space-y-6" id="eventList">
    <!-- Events will appear here -->
  </main>

  <!-- Footer -->
  <footer class="bg-red-600 text-white text-center py-4 mt-12">
    <p class="text-md">&copy; 2025 <strong>BloodBridge</strong>. Powered by purpose ❤️</p>
  </footer>

  <!-- Script to Add Events -->
  <script>
    const form = document.getElementById("eventForm");
    const eventList = document.getElementById("eventList");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const hospital = document.getElementById("hospital").value;
      const location = document.getElementById("location").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const organizer = document.getElementById("organizer").value;

      const eventCard = document.createElement("div");
      eventCard.className = "bg-white border-l-8 border-red-500 shadow-md rounded-xl p-6";

      eventCard.innerHTML = `
        <h3 class="text-2xl font-bold text-red-600 mb-1">🏥 ${hospital}</h3>
        <p class="text-gray-700 mb-1">📍 Location: ${location}</p>
        <p class="text-gray-700 mb-1">📅 Date: <strong>${new Date(date).toDateString()}</strong></p>
        <p class="text-gray-700 mb-1">⏰ Time: ${time}</p>
        <p class="text-gray-700">🩸 Organized by: ${organizer}</p>
      `;

      eventList.appendChild(eventCard);
      form.reset();
    });
  </script>

</body>
</html>
