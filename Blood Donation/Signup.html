<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup | BloodBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-red-100">
  <div class="bg-white p-8 rounded-xl shadow-xl w-96">
    <h2 class="text-2xl font-bold mb-6 text-red-600 text-center">Create an Account</h2>
    <input type="email" id="email" placeholder="Email" class="w-full mb-4 px-4 py-2 border border-red-300 rounded-lg focus:outline-none" />
    <input type="password" id="password" placeholder="Password" class="w-full mb-4 px-4 py-2 border border-red-300 rounded-lg focus:outline-none" />
    <button onclick="signup()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">Sign Up</button>
    <p class="mt-4 text-sm text-gray-600 text-center">Already have an account? <a href="login.html" class="text-red-500 hover:underline">Login</a></p>
  </div>
    <!-- Desktop Menu -->
      <div id="menu" class="hidden md:flex md:items-center space-x-6 text-lg font-medium">
        <a href="LoginPage.html" class="hover:text-red-500 transition"></a>
      </div>

  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyDAbZqpnvj0HrhjTwP9kSV_Pn3adqOFuzI",
        authDomain: "bloodbridge-ca8b4.firebaseapp.com",
        projectId: "bloodbridge-ca8b4",
        storageBucket: "bloodbridge-ca8b4.firebasestorage.app",
        messagingSenderId: "477571925690",
        appId: "1:477571925690:web:d12236443b24af63c12483",
      };

    firebase.initializeApp(firebaseConfig);

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          user.sendEmailVerification()
            .then(() => {
              alert("✅ Verification email sent! Please check your inbox and click the link to verify your email.");
              // Don't redirect yet!
            })
            .catch((err) => {
              alert("❗ Could not send verification email: " + err.message);
            });
        })
        .catch((error) => {
          alert("Signup error: " + error.message);
        });
    }
  </script>
</body>
</html>
