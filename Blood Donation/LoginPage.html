<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | BloodBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .heading-font {
      font-family: 'Merriweather', serif;
    }

    .fancy-hover {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .fancy-hover::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      top: 100%;
      left: 0;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      z-index: -1;
    }

    .fancy-hover:hover::after {
      top: 0;
    }

    .blob-bg {
      position: absolute;
      top: -80px;
      left: -100px;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    .glass-card {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 0, 0, 0.2);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-red-50 via-white to-red-100 text-gray-800 min-h-screen">

  <!-- SVG Blob -->
  <svg class="blob-bg w-[500px] h-[500px]" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="#ef4444" d="M50.2,-65.2C65.4,-53.2,77.1,-37.4,78.9,-20.7C80.7,-4,72.6,13.6,63.2,28.2C53.8,42.8,43,54.4,29.6,63.6C16.2,72.8,0.1,79.6,-14.4,76.5C-28.9,73.3,-42,60.1,-53.4,46.2C-64.8,32.3,-74.6,17.7,-75.3,2.4C-76.1,-12.9,-67.8,-28.9,-57.1,-42.4C-46.3,-55.8,-33.1,-66.7,-17.2,-72.6C-1.2,-78.5,17.4,-79.4,33.3,-72.6C49.1,-65.7,62,-51.2,50.2,-65.2Z" transform="translate(100 100)" />
  </svg>

  <!-- Navbar -->
  <nav class="fixed w-full top-0 left-0 z-40 backdrop-blur-lg bg-white/30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-red-600 heading-font">BloodBridge</h1>
      <div class="space-x-6 flex items-center">
        <a href="index.html" class="hover:text-red-500 transition">Home</a>
<a href="doner.html" class="hover:text-red-500 transition">Find Donor</a>
        <a href="#" class="hover:text-red-500 transition">Become Donor</a>
        <a href="RequestBlood.html" class="hover:text-red-500 transition">Request Blood</a>
        <a href="#" class="hover:text-red-500 transition">Events</a>
        <a href="LoginPage.html" target ="none" class="hover:text-red-500 transition">
        <button class="ml-4 bg-red-500 text-white px-5 py-2 rounded-lg hover:bg-red-600 shadow-md transition-all">Login</button></a>
      </div>
    </div>
  </nav>

  <!-- Login Form Section -->
  <main class="relative z-10 pt-32 pb-24 px-6 flex justify-center">
    <div class="glass-card p-10 rounded-3xl shadow-2xl max-w-xl w-full">
      <h2 class="text-3xl heading-font text-red-700 font-bold text-center mb-4">Login</h2>
      <p class="text-center text-gray-700 mb-4">Access your BloodBridge dashboard securely</p>

      <!-- Success Message -->
      <div id="successMessage" class="hidden mb-4 bg-green-100 text-green-800 font-semibold text-center px-4 py-3 rounded-lg border border-green-300">
        ✅ Login Successful! Redirecting...
      </div>

      <form id="loginForm" class="grid gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" required placeholder="you@example.com" class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" required placeholder="Your password" class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />
        </div>
        <button type="submit" class="fancy-hover bg-red-500 text-white font-semibold py-3 rounded-lg shadow-lg hover:bg-red-600 transition-transform transform hover:scale-105">
          Login
        </button>
        <p class="text-sm text-center text-gray-700 mt-4">
          Don’t have an account?
          <a href="Signup.html" class="text-red-600 font-semibold hover:underline">Sign up</a>
        </p>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-red-600 text-white text-center py-6">
    <p>&copy; 2025 BloodBridge. Made with ❤️ to save lives.</p>
  </footer>

  <!-- JavaScript for Login Success -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDAbZqpnvj0HrhjTwP9kSV_Pn3adqOFuzI",
        authDomain: "bloodbridge-ca8b4.firebaseapp.com",
        projectId: "bloodbridge-ca8b4",
        storageBucket: "bloodbridge-ca8b4.firebasestorage.app",
        messagingSenderId: "477571925690",
        appId: "1:477571925690:web:d12236443b24af63c12483",
      };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = e.target.querySelector('input[type="email"]').value;
      const password = e.target.querySelector('input[type="password"]').value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          document.getElementById("successMessage").classList.remove("hidden");
          setTimeout(() => {
            window.location.href = "donorForm.html"; // or donorForm.html or thankyou.html
          }, 1500);
        })
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    });
  </script>

</body>
</html>
