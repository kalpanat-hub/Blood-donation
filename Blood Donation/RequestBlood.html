<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Blood | BloodBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .heading-font {
      font-family: 'Merriweather', serif;
    }

    .fancy-hover {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .fancy-hover::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      top: 100%;
      left: 0;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      z-index: -1;
    }

    .fancy-hover:hover::after {
      top: 0;
    }

    .blob-bg {
      position: absolute;
      top: -80px;
      left: -100px;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    .glass-card {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 0, 0, 0.2);
    }

    #toast {
      animation: fadeInOut 3s ease forwards;
    }

    @keyframes fadeInOut {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }

      10% {
        opacity: 1;
        transform: translateY(0);
      }

      90% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-20px);
      }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-red-50 via-white to-red-100 text-gray-800 min-h-screen">

  <!-- Toast Notification at Top -->
  <div id="toast" class="hidden fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50">
    ✅ Blood request submitted successfully!
  </div>

  <!-- SVG Blob -->
  <svg class="blob-bg w-[500px] h-[500px]" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <path fill="#ef4444" d="M50.2,-65.2C65.4,-53.2,77.1,-37.4,78.9,-20.7C80.7,-4,72.6,13.6,63.2,28.2C53.8,42.8,43,54.4,29.6,63.6C16.2,72.8,0.1,79.6,-14.4,76.5C-28.9,73.3,-42,60.1,-53.4,46.2C-64.8,32.3,-74.6,17.7,-75.3,2.4C-76.1,-12.9,-67.8,-28.9,-57.1,-42.4C-46.3,-55.8,-33.1,-66.7,-17.2,-72.6C-1.2,-78.5,17.4,-79.4,33.3,-72.6C49.1,-65.7,62,-51.2,50.2,-65.2Z" transform="translate(100 100)" />
  </svg>

  <!-- Navbar -->
  <nav class="fixed w-full top-0 left-0 z-40 backdrop-blur-lg bg-white/30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-red-600 heading-font">BloodBridge</h1>
      <div class="space-x-6 flex items-center">
        <a href="index.html" class="hover:text-red-500 transition">Home</a>
        <a href="doner.html" class="hover:text-red-500 transition">Find Donor</a>
        <a href="#" class="hover:text-red-500 transition">Become Donor</a>
        <a href="RequestBlood.html" class="hover:text-red-500 transition">Request Blood</a>
        <a href="event.html" class="hover:text-red-500 transition">Events</a>
       <a href="LoginPage.html" target ="none" class="hover:text-red-500 transition">
        <button class="ml-4 bg-red-500 text-white px-5 py-2 rounded-lg hover:bg-red-600 shadow-md transition-all">Login</button></a>
      </div>
    </div>
  </nav>

  <!-- Form Section -->
  <main class="relative z-10 pt-32 pb-24 px-6 flex justify-center">
    <div class="glass-card p-10 rounded-3xl shadow-2xl max-w-xl w-full">
      <h2 class="text-3xl heading-font text-red-700 font-bold text-center mb-4">Request Blood</h2>
      <p class="text-center text-gray-700 mb-8">Fill the details below to notify our network of donors.</p>
      <form id="bloodForm" class="grid gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" required placeholder="e.g., Jane Doe" class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="tel" pattern="[0-9]{10}" required placeholder="1234567890" class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Blood Group</label>
          <select required class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400">
            <option disabled selected>Select group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Units Required</label>
          <input type="number" min="1" max="10" required placeholder="e.g., 2" class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Date Required</label>
          <input type="date" required
            class="mt-1 w-full px-4 py-2 rounded-lg border border-red-200 focus:ring-2 focus:ring-red-400" />  </div>
       
        <button type="submit" class="fancy-hover bg-red-500 text-white font-semibold py-3 rounded-lg shadow-lg hover:bg-red-600 transition-transform transform hover:scale-105">
          Submit Request
        </button>
     
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-red-600 text-white text-center py-6">
    <p>&copy; 2025 BloodBridge. Made with ❤️ to save lives.</p>
  </footer>

  <!-- JS: Toast & Clear Form -->
  <script>
    const form = document.getElementById("bloodForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Show toast notification
      const toast = document.getElementById("toast");
      toast.classList.remove("hidden");

      // Optionally clear the form
      form.reset();

      // Redirect after a short delay
      setTimeout(() => {
        window.location.href = "maps.html";
      }, 2000); // 2 second delay to show the toast
    });
  </script>
</body>

</html>
